[package]
name = "cleanlogi"
version = "0.1.0"
edition = "2024"
description = "CleanLogi: a tiny menu-bar replacement for Logi Options+ on macOS"
license = "AGPL-3.0-only"
repository = "https://github.com/saeedvaziry/cleanlogi"
publish = false

[dependencies]
anyhow = "1.0.104"
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
hidapi = { version = "2.6.7", default-features = false, features = ["macos-shared-device"] }
libc = "0.2.191"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
toml = "1.1.8"
toml_edit = "0.25.17"
tray-icon = "0.26.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
